services:
  itec_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: itec_db
    networks:
      default:
        aliases:
          - itecdb
    ports:
      - "5433:5432"

  backend:
    build:
      context: ./server  # Changed from ./backend to match your folder screenshot
      dockerfile: Dockerfile
    env_file:
      - ./server/.env
    ports:
      - "3001:3001"
    volumes:
      # THE BRIDGE: This allows your Node.js app to talk to Docker Desktop
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - itec_db

  frontend:
    build:
      context: ./client  # Changed from ./frontend to match your folder screenshot
      dockerfile: Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:3001
      VITE_SOCKET_URL: http://localhost:3001
    ports:
      - "4173:4173"
    depends_on:
      - backend

# We can remove the "runner" services from the YAML. 
# It is better to have the Backend spin them up on-demand 
# rather than having them "sleep" in the background forever.
